[package]
name = "conducted"
version = "0.1.0"
description = "Run coding agents in parallel, each in its own git worktree"
authors = ["Jan Hallvard Larsen"]
license = "MIT"
repository = "https://github.com/jahala/conducted"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "conducted_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2.6.0", features = ["sqlite"] }
tauri-plugin-shell = "2.6.0"
tauri-plugin-fs = "2.7.1"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-notification = "2.8.0"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-deep-link = "2.6.3"
tauri-plugin-window-state = "2.5.0"
thiserror = "2.0.21"
portable-pty = "0.9.0"
alacritty_terminal = "0.26.0"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "tiff", "webp"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
