[package]
name = "conducted"
version = "0.2.1"
description = "Run coding agents in parallel, each in its own git worktree"
authors = ["Jan Hallvard Larsen"]
license = "MIT"
repository = "https://github.com/jahala/conducted"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "conducted_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "protocol-asset"] }
tauri-plugin-opener = "2"
muda = { version = "0.20", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tauri-plugin-sql = { version = "2.6.0", features = ["sqlite"] }
rusqlite = { version = "0.32", default-features = false }
tauri-plugin-shell = "2.6.0"
tauri-plugin-fs = "2.7.1"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-notification = "2.8.0"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-deep-link = "2.6.3"
tauri-plugin-window-state = "2.5.0"
thiserror = "2.0.21"
security-framework = "3.7.0"
system-configuration = "0.7"
core-foundation = "0.9"
portable-pty = "0.9.0"
alacritty_terminal = "0.26.0"
globset = "0.4"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "tiff", "webp"] }
nucleo-matcher = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "stream", "system-proxy", "charset", "http2"] }
futures-util = "0.3"
# The Rust shell owns the cloud WebSocket because the web view cannot set its headers (CLOUD-03).
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "macros", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
# The same app data folder rule Tauri uses, read before Tauri starts (PLAT-27, `lib.rs`).
dirs = "7"
# Unpack the program downloads (PLAT-28, PLAT-35): Codex ships zstd, gh a zip, watchexec tar.xz,
# and Cursor's SDK npm tarballs, which are gzip-compressed tar files (AGENT-09).
# Licences checked (D010): ruzstd MIT, zip MIT, tar MIT or Apache-2.0, lzma-rust2 Apache-2.0,
# flate2 MIT or Apache-2.0 (already in the tree through zip).
ruzstd = "0.9"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
tar = { version = "0.4", default-features = false }
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "xz"] }
# Checks, downloads, verifies and installs app updates from our own feed (PLAT-13, D079).
tauri-plugin-updater = "2"
flate2 = "1"
# AES-256-GCM for saved terminal scrollback (PLAT-08, D087). Already in the tree for the test that
# checks minisign signatures, so the lockfile does not change.
ring = "0.17"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSButton", "NSControl", "NSPasteboard", "NSPasteboardItem", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSGeometry", "NSString", "NSURL", "objc2-core-foundation"] }

[dev-dependencies]
# The mock app that lets a test hear the events a command emits (PLAT-36 builds on it).
tauri = { version = "2", features = ["test"] }
# Tests build xz archives of their own to serve from a local server (PLAT-35).
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "xz", "encoder"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
