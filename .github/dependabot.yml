# Dependabot: version updates only, grouped so minor and patch bumps arrive as one PR.
# Ecosystems in this repo:
#   - npm: the pnpm workspace (root package.json and lockfile cover every package)
#   - cargo: the Tauri shell in apps/desktop/src-tauri
#   - github-actions: workflow action versions
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    # The file icons are pinned to the versions whose art matches Conductor's (#535, D131): a newer
    # material-icon-theme (5.2.0 on) redraws every icon, and newer simple-icons and react-icons
    # redraw some of the glyphs Conductor draws. They move only with a side-by-side check.
    ignore:
      - dependency-name: material-icon-theme
      - dependency-name: simple-icons
      - dependency-name: react-icons

  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
