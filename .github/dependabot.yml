# Dependabot: version updates only, grouped so minor and patch bumps arrive as one PR.
# Ecosystems in this repo:
#   - npm: the pnpm workspace (root package.json and lockfile cover every package)
#   - cargo: the Tauri shell in apps/desktop/src-tauri
#   - github-actions: workflow action versions
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
    # muda parses menu accelerators exactly as Tauri's own menu does, so it moves only when Tauri
    # moves to a new muda (src/menu.rs).
    ignore:
      - dependency-name: muda
