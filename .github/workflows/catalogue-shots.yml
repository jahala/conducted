name: Catalogue shots

# Draws every state of the states catalogue (docs/engineering.md, "States catalogue") in Chromium
# and uploads the PNGs, so a screen change can be read beside Conductor's captures without a
# browser run on the owner's Mac. Runs on pull requests that touch the desktop's screens. The same
# job runs the browser check of the Codex visualization frame under the app's production policy
# (scripts/visualization/frame-policy.browser.ts, issue #466) and the Loadout's pointer drag
# (scripts/catalogue/loadout-drag.browser.ts, issue #481).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "apps/desktop/src/**"
      - "scripts/catalogue/**"
      - "apps/desktop/vite.catalogue.config.ts"
      - "apps/desktop/src-tauri/tauri.conf.json"
      - "apps/desktop/src-tauri/src/visualization.rs"
      - "scripts/visualization/**"
      - ".github/workflows/catalogue-shots.yml"

permissions:
  contents: read

concurrency:
  group: catalogue-shots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shots:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # Microsoft's Playwright image for the locked playwright-core (1.64.0): Chromium and its system
    # packages are already in it, so the job never needs Ubuntu's package mirror (issue #540).
    container:
      image: mcr.microsoft.com/playwright@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f # v1.64.0-noble
    # A full run takes about 14 minutes (2026-11-08), so 15 cut normal runs off. The limit catches
    # a hang, not slowness.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # ratchet:pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # ratchet:actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      # setup-bun needs unzip, which the Playwright image lacks; npm's bun package carries the binary.
      - name: Install bun from npm at the pinned version
        run: npm install --global "bun@$(cat .bun-version)"
      # The job runs as root in the container and the checkout belongs to the runner's user, so git
      # refuses the folder until it is marked safe.
      - name: Let git use the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: pnpm install --frozen-lockfile
      - run: bun scripts/catalogue/shots.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7.0.2
        with:
          name: catalogue-shots
          path: .context/shots/ours/
          retention-days: 14
      - name: The visualization frame runs its scripts under the production policy
        if: ${{ !cancelled() }}
        run: bun scripts/visualization/frame-policy.browser.ts
      - name: The Loadout takes a model from a real pointer drag
        if: ${{ !cancelled() }}
        run: bun scripts/catalogue/loadout-drag.browser.ts
