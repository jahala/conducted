name: Agent program versions

# Watches the agent programs the app pins (PLAT-28). Each day it reads the newest Claude Code and
# Codex releases from the vendors' own manifests, along with the SDK versions Claude Code says it
# is compatible with, and opens or updates one pull request when a pin moves. The script changes
# nothing when every pinned copy is current. It needs no secret beyond the workflow's own token.
on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# One run at a time: a second run would write the same branch while the first pushes it.
concurrency:
  group: agent-program-versions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BRANCH: chore/agent-program-versions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          ref: main
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # ratchet:pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # ratchet:actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # ratchet:oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Read the publishers' newest versions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/programs/update-feed.ts
      # A moved SDK pin needs its lockfile entry. Other changes leave the lockfile alone, so the
      # workflow cannot propose a lockfile rewrite of its own.
      - name: Update the lockfile when the SDK pin moved
        run: |
          if git diff --quiet -- packages/sidecar/package.json; then
            exit 0
          fi
          pnpm install --lockfile-only
      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Every pinned copy is current; nothing to propose."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add \
            apps/desktop/src-tauri/programs/release-feed.json \
            apps/desktop/src-tauri/src/binaries.rs \
            packages/sidecar/package.json \
            pnpm-lock.yaml \
            apps/cloud/sandbox/image.ts \
            apps/cloud/sandbox/Dockerfile
          git commit \
            -m "chore: update agent program versions" \
            -m "Read the newest Claude Code and Codex releases from their publishers, with the sizes and digests from each release's own manifest, and move the SDK pin to the newest wrapper Claude Code tested. The release feed, the Rust pins and the cloud image's programs move together."
          git push --force origin "$BRANCH"
          number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          body="The newest Claude Code, Codex and Claude Agent SDK versions the publishers have released, with the feed's sizes and SHA-256 from the vendors' own manifests. The feed, the Rust pins, the sidecar's SDK pin and the cloud image move together. Generated by .github/workflows/agent-programs.yml; merge when CI is green."
          if [ -z "$number" ]; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$BRANCH" \
              --title "chore: update agent program versions" \
              --body "$body"
          else
            gh pr edit "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          fi
