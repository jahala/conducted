name: Release

# Builds, signs, notarises and publishes the app when a version tag is pushed (PLAT-37).
# A tag whose version has a suffix, such as v0.2.2-rc.1, makes a pre-release: the dry run.
# The steps live in scripts/release-ci.ts and scripts/release/, which tests cover; this file
# only supplies the runner, the credentials and the order.
on:
  push:
    tags: ["v*"]

# contents writes the release, and the attestations need an OIDC token and their own write.
permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # The app is macOS-only, and the Developer ID identity and notarytool live here.
    runs-on: macos-latest
    # A hung build would otherwise run for GitHub's default of six hours.
    timeout-minutes: 60
    env:
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          # The changelog needs the commits before the tag, and the tag itself.
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # ratchet:pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # ratchet:actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # ratchet:oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # ratchet:dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # ratchet:Swatinem/rust-cache@v2.9.3
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install the locked packages
        run: pnpm install --frozen-lockfile
      # Every credential is checked before anything is built, so a missing one names itself and
      # CI never makes a signed-but-not-notarised build.
      - name: Check the release credentials
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: bun scripts/release/credentials.ts
      - name: Check the tag matches every version file
        run: bun scripts/release/tag-check.ts "$GITHUB_REF_NAME"
      - name: Import the Developer ID certificate into a temporary keychain
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/conducted-release.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 -D > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -s "$KEYCHAIN_PATH"
      - name: Write the App Store Connect key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          printf '%s' "$APPLE_API_KEY_P8" | base64 -D > "$RUNNER_TEMP/apple-api-key.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/apple-api-key.p8" >> "$GITHUB_ENV"
      - name: Build, sign, notarise and make the updater files
        id: build
        run: bun scripts/release-ci.ts "$GITHUB_REF_NAME"
      - name: Cut the release notes from CHANGELOG.md
        run: bun scripts/release/notes.ts "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
      # Anyone can then run: gh attestation verify <file> --repo jahala/conducted
      - name: Attest every release file
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # ratchet:actions/attest-build-provenance@v4.2.2
        with:
          subject-path: |
            ${{ steps.build.outputs.dmg }}
            ${{ steps.build.outputs.archive }}
            ${{ steps.build.outputs.signature }}
            ${{ steps.build.outputs.feed }}
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          APPLE_SIGNING_IDENTITY: ""
          APPLE_API_KEY_ID: ""
          APPLE_API_ISSUER: ""
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: >-
          bun scripts/release/publish.ts "$GITHUB_REF_NAME"
          "${{ steps.build.outputs.dmg }}"
          "${{ steps.build.outputs.archive }}"
          "${{ steps.build.outputs.signature }}"
          "${{ steps.build.outputs.feed }}"
          --notes-file "$RUNNER_TEMP/release-notes.md"
      # Always: the certificate and the App Store Connect key must not survive the run.
      - name: Delete the temporary keychain and the App Store Connect key
        if: always()
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/conducted-release.keychain-db"
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/apple-api-key.p8"
