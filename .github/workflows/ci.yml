name: CI

# Runs on pushes to main and on pull requests that are ready for review.
# Draft PRs run nothing: batch them, mark the batch ready, and CI runs once.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# A newer push cancels the older run of the same pull request. A push to main never cancels the
# run of the commit before it, so every commit on the main line gets its verdict.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  typescript:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # A hung test would otherwise run for GitHub's default of six hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # ratchet:pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # ratchet:actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # ratchet:oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - id: install
        run: pnpm install --frozen-lockfile
      # Every check below runs even when one before it failed, so one round shows every failing
      # check. They are skipped only when the install failed or the run was cancelled.
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm exec biome ci .
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: shellcheck bin/*.sh
      # The RUN-09 tests run the terminal shim in a real zsh, which this image does not ship.
      - name: Install zsh
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: sudo apt-get update -qq && sudo apt-get install -qq --yes --no-install-recommends zsh
      - name: Tests (each runner also writes a JUnit report)
        id: tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          CONDUCTED_TEST_REPORTS: ${{ runner.temp }}/test-reports
        run: |
          mkdir -p "$CONDUCTED_TEST_REPORTS"
          pnpm test
      # One list of every failed test by file, also on the run's summary page. It fails when a
      # report is missing, so a runner that crashed before writing one is never read as green.
      - name: Failed tests, by file
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: >-
          bun scripts/test-report.ts "$RUNNER_TEMP/test-reports"
          desktop=apps/desktop protocol=packages/protocol shared=packages/shared
          sidecar=packages/sidecar scripts=.
      - name: Build the web UI that ships inside the app
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm build
      # The workflows guard runs actionlint, which the runner image does not ship.
      - name: Install actionlint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Guards (docs, data model, migrations, headers, markers, versions, workflows)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm guards
      - name: Placeholders match the backlog
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm stubs

  rust:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    # The app is macOS-only (WKWebView, Keychain, Apple speech), so the shell is checked on macOS.
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # ratchet:dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # ratchet:Swatinem/rust-cache@v2.9.3
        with:
          workspaces: apps/desktop/src-tauri
      # The relay integration test starts the Worker in Cloudflare's local runtime, so this job
      # installs the cloud package's wrangler and workerd as well as the Rust toolchain.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # ratchet:pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # ratchet:actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install the Worker runtime for the relay test
        working-directory: .
        run: pnpm install --frozen-lockfile --filter @conducted/cloud
      # As in the TypeScript job, a format failure does not hide a clippy or test failure.
      - run: cargo fmt --check
      - if: ${{ !cancelled() }}
        run: cargo clippy --all-targets -- -D warnings
      - if: ${{ !cancelled() }}
        run: cargo test
