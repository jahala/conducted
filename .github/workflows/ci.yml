name: CI

# Runs on pushes to main and on pull requests that are ready for review.
# Draft PRs run nothing: batch them, mark the batch ready, and CI runs once.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# A newer push cancels the older run of the same pull request. A push to main never cancels the
# run of the commit before it, so every commit on the main line gets its verdict.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  typescript:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # A hung test would otherwise run for GitHub's default of six hours. A full run takes 9 to 12
    # minutes (2026-11-11), and slow package mirrors pushed two runs past 15, so the limit sits well
    # above a normal run: it catches a hang, not slowness.
    timeout-minutes: 30
    steps:
      # Two commits deep: a pull request's run checks out the merge commit, and its first parent
      # is main's tip, the base the changed-only test run compares with.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # ratchet:pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # ratchet:actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # ratchet:oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - id: install
        run: pnpm install --frozen-lockfile
      # Every check below runs even when one before it failed, so one round shows every failing
      # check. They are skipped only when the install failed or the run was cancelled.
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm exec biome ci .
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: shellcheck bin/*.sh
      # A pull request runs the tests its changes can reach (scripts/run-tests.ts, rules in
      # scripts/test-rules.ts); main runs every test after each merge, the net under that choice.
      - name: Tests (each runner also writes a JUnit report)
        id: tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          CONDUCTED_TEST_REPORTS: ${{ runner.temp }}/test-reports
        run: |
          mkdir -p "$CONDUCTED_TEST_REPORTS"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            pnpm test:changed --since HEAD^1
          else
            pnpm test
          fi
      # One list of every failed test by file, also on the run's summary page. The test run names
      # the runners it started in runners.txt; a runner whose report is missing fails this step,
      # so one that crashed before writing it is never read as green.
      - name: Failed tests, by file
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: xargs bun scripts/test-report.ts "$RUNNER_TEMP/test-reports" < "$RUNNER_TEMP/test-reports/runners.txt"
      - name: Build the web UI that ships inside the app
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm build
      # The workflows guard runs actionlint, which the runner image does not ship.
      - name: Install actionlint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Guards (docs, data model, migrations, headers, markers, versions, workflows)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm guards
      - name: Placeholders match the backlog
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm stubs

  # Whether a pull request can reach the macOS job below (scripts/macos-job.ts, the rules are
  # MACOS_JOB in scripts/test-rules.ts). GitHub's macOS runners are scarce: on 2026-11-12 the job
  # waited 15 minutes for one and was cancelled on seven pull requests (#641). A push to main
  # skips this and runs the macOS job.
  macos-changes:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      macos: ${{ steps.select.outputs.macos }}
    steps:
      # Two commits deep, as in the TypeScript job: the merge commit's first parent is main's tip.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # ratchet:pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # ratchet:actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # ratchet:oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      # The selection walks the macOS tests' imports, and a package import resolves only once the
      # package is installed. Nothing runs, so no install script is needed.
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter "@conducted/desktop..."
      - id: select
        run: bun scripts/macos-job.ts --since HEAD^1 >> "$GITHUB_OUTPUT"

  rust:
    # Every push to main; a ready pull request unless macos-changes answered `false`. When that
    # job failed it answered nothing, so this runs. A job skipped by its condition reports success,
    # so the required check passes on a pull request that cannot reach it.
    needs: macos-changes
    if: >-
      ${{ !cancelled() && (github.event_name == 'push' ||
      (github.event.pull_request.draft == false && needs.macos-changes.outputs.macos != 'false')) }}
    # The app is macOS-only (WKWebView, Keychain, Apple speech), so the shell is checked on macOS,
    # and so are the desktop's tests that need macOS's own programs.
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # ratchet:dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # ratchet:Swatinem/rust-cache@v2.9.3
        with:
          workspaces: apps/desktop/src-tauri
      # The relay integration test starts the Worker in Cloudflare's local runtime, so this job
      # installs the cloud package's wrangler and workerd as well as the Rust toolchain.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # ratchet:pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # ratchet:actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # ratchet:oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      # The Worker's runtime for the relay test, and the desktop's test tools for the tests that
      # need macOS's own programs.
      - name: Install the Worker runtime and the desktop's test tools
        working-directory: .
        run: pnpm install --frozen-lockfile --filter @conducted/cloud --filter "@conducted/desktop..."
      # As in the TypeScript job, a format failure does not hide a clippy or test failure.
      - run: cargo fmt --check
      - if: ${{ !cancelled() }}
        run: cargo clippy --all-targets -- -D warnings
      - if: ${{ !cancelled() }}
        run: cargo test
      # The desktop's macOS tests (`*.macos.test.ts`): the terminal shim in the real /bin/zsh.
      - name: Desktop tests that need macOS
        if: ${{ !cancelled() }}
        working-directory: .
        run: pnpm test:macos
